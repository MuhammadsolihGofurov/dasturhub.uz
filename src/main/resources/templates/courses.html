<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org" x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurslar — DasturHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#dc2626', 600: '#b91c1c' } } } }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.01em; }
        .hero-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(220, 38, 38, 0.05) 1px, transparent 0);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-white dark:bg-[#050505] text-slate-900 dark:text-slate-100 transition-colors duration-500">

<div th:replace="~{fragments/header :: myHeader}"></div>

<!-- Main Grid -->
<section class="pb-12 pt-24 bg-[#fdfdfd] dark:bg-[#080808]">
    <div class="max-w-7xl mx-auto px-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">

            <!-- Java Course -->
            <div class="group relative">
                <a th:href="@{/courses/details}">
                    <div class="overflow-hidden bg-slate-100 dark:bg-white/5 aspect-[16/10] mb-6 rounded-2xl">
                        <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80&w=1000" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
                    </div>
                    <div class="px-2">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="w-8 h-[1px] bg-brand-500"></span>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Backend</span>
                        </div>
                        <h3 class="text-xl font-bold dark:text-white mb-2 group-hover:text-brand-500 transition">Java Spring Boot: Enterprise</h3>
                        <p class="text-[15px] font-bold text-brand-500">1,200,000 UZS</p>
                    </div>
                </a>
                <div class="absolute -bottom-4 left-0 w-0 h-[2px] bg-brand-500 transition-all duration-500 group-hover:w-full"></div>
            </div>

            <!-- React Course -->
            <div class="group relative">
                <div class="overflow-hidden bg-slate-100 dark:bg-white/5 aspect-[16/10] mb-6 rounded-2xl">
                    <img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?auto=format&fit=crop&q=80&w=1000" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
                </div>
                <div class="px-2">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="w-8 h-[1px] bg-brand-500"></span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Frontend</span>
                    </div>
                    <h3 class="text-xl font-bold dark:text-white mb-2 group-hover:text-brand-500 transition">React & Next.js Masterclass</h3>
                    <p class="text-[15px] font-bold text-brand-500">1,100,000 UZS</p>
                </div>
                <div class="absolute -bottom-4 left-0 w-0 h-[2px] bg-brand-500 transition-all duration-500 group-hover:w-full"></div>
            </div>

            <!-- Flutter Course -->
            <div class="group relative">
                <div class="overflow-hidden bg-slate-100 dark:bg-white/5 aspect-[16/10] mb-6 rounded-2xl">
                    <img src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?auto=format&fit=crop&q=80&w=1000" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
                </div>
                <div class="px-2">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="w-8 h-[1px] bg-brand-500"></span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Mobile</span>
                    </div>
                    <h3 class="text-xl font-bold dark:text-white mb-2 group-hover:text-brand-500 transition">Flutter: Multi-platform Apps</h3>
                    <p class="text-[15px] font-bold text-brand-500">1,300,000 UZS</p>
                </div>
                <div class="absolute -bottom-4 left-0 w-0 h-[2px] bg-brand-500 transition-all duration-500 group-hover:w-full"></div>
            </div>

        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: myFooter}"></div>

</body>
</html>
