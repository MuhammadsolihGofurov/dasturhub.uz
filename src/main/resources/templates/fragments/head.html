<head th:fragment="myHead">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${seo_title}">DasturHub — Modern Red Edition</title>
    <meta name="description" th:content="${seo_description}">
    <meta name="keywords" th:content="${seo_keywords}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#dc2626', // Modern Red
                            600: '#b91c1c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.01em; }
        .hero-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(220, 38, 38, 0.05) 1px, transparent 0);
            background-size: 32px 32px;
        }
    </style>

    <link rel="stylesheet" th:href="@{/styles/toastify.min.css}">
    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <script th:src="@{/js/toastify.min.js}"></script>

    <script th:src="@{/js/main.js}"></script>
</head>
