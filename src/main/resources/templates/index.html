<!DOCTYPE html>
<html lang="uz" x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<head th:replace="~{fragments/head :: myHead}"></head>
<body class="bg-white dark:bg-[#050505] text-slate-900 dark:text-slate-100 transition-colors duration-500">

<!-- 1. Modern Header -->
<div th:replace="~{fragments/header :: myHeader('home')}"></div>

<!-- 2. Minimalist Hero (350px) -->
<section class="relative h-[350px] flex items-center justify-center pt-16 hero-pattern">
    <div th:each="banner: ${banners}" class="text-center px-6">
        <span th:text="${banner.subTitle}" class="inline-block px-3 py-1 bg-brand-500/10 text-brand-500 text-[10px] font-bold uppercase tracking-[0.3em] rounded-full mb-6">Kelajak IT Akademiyasi</span>
        <h1 th:utext="${banner.title}"
            class="text-4xl md:text-5xl font-800 tracking-tighter text-slate-900 dark:text-white mb-6 uppercase">
        </h1>
        <div class="w-16 h-1 bg-brand-500 mx-auto rounded-full"></div>
    </div>
</section>

<!-- 3. Courses Grid -->
<section class="py-20 bg-[#fdfdfd] dark:bg-[#080808]">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex items-center justify-between mb-16">
            <h2 class="text-2xl font-800 uppercase tracking-tighter dark:text-white">Saralangan Kurslar</h2>
            <a href="/courses" class="text-[11px] font-bold text-brand-500 uppercase tracking-widest border-b border-brand-500 pb-1">Barchasini ko'rish</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <!-- Course Card -->
            <a th:href="@{/courses/details}" class="group relative">
                <div class="overflow-hidden bg-slate-100 dark:bg-white/5 aspect-[16/10] mb-6 rounded-2xl">
                    <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80&w=1000"
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
                </div>
                <div class="px-2">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="w-8 h-[1px] bg-brand-500"></span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Backend Development</span>
                    </div>
                    <h3 class="text-xl font-bold dark:text-white mb-2 group-hover:text-brand-500 transition">Java Spring Boot: Enterprise</h3>
                    <p class="text-[15px] font-bold text-brand-500">1,200,000 UZS</p>
                </div>
                <!-- Hover Effect Line -->
                <div class="absolute -bottom-4 left-0 w-0 h-[2px] bg-brand-500 transition-all duration-500 group-hover:w-full"></div>
            </a>

            <!-- Card 2 (Frontend) -->
            <a th:href="@{/courses/details}" class="group relative">
                <div class="overflow-hidden bg-slate-100 dark:bg-white/5 aspect-[16/10] mb-6 rounded-2xl">
                    <img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?auto=format&fit=crop&q=80&w=1000"
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
                </div>
                <div class="px-2">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="w-8 h-[1px] bg-brand-500"></span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Frontend Art</span>
                    </div>
                    <h3 class="text-xl font-bold dark:text-white mb-2 group-hover:text-brand-500 transition">React & Next.js Masterclass</h3>
                    <p class="text-[15px] font-bold text-brand-500">1,100,000 UZS</p>
                </div>
                <div class="absolute -bottom-4 left-0 w-0 h-[2px] bg-brand-500 transition-all duration-500 group-hover:w-full"></div>
            </a>

            <!-- Card 3 (Mobile) -->
            <a th:href="@{/courses/details}" class="group relative">
                <div class="overflow-hidden bg-slate-100 dark:bg-white/5 aspect-[16/10] mb-6 rounded-2xl">
                    <img src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?auto=format&fit=crop&q=80&w=1000"
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
                </div>
                <div class="px-2">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="w-8 h-[1px] bg-brand-500"></span>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Mobile Apps</span>
                    </div>
                    <h3 class="text-xl font-bold dark:text-white mb-2 group-hover:text-brand-500 transition">Flutter: Multi-platform Apps</h3>
                    <p class="text-[15px] font-bold text-brand-500">1,300,000 UZS</p>
                </div>
                <div class="absolute -bottom-4 left-0 w-0 h-[2px] bg-brand-500 transition-all duration-500 group-hover:w-full"></div>
            </a>
        </div>
    </div>
</section>

<!-- 4. Simple Footer -->
<div th:replace="~{fragments/footer :: myFooter}"></div>

</body>
</html>
