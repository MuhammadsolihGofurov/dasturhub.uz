<!DOCTYPE html>
<html lang="uz" x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<head th:replace="~{fragments/head :: myHead}">
    <title>Yangi Kurs — DasturHub</title>
</head>
<body class="bg-[#fcfcfc] dark:bg-[#050505] text-slate-900 dark:text-slate-100">

<div th:replace="~{fragments/header :: myHeader('lessons_manage')}"></div>

<main class="pt-24 pb-20">
    <div class="max-w-3xl mx-auto px-6">

        <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-4">
            <a th:href="@{/lessons/manage/{id}(id = ${sectionId}) }" class="hover:text-brand-500 transition">Dars</a>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
            <span class="text-slate-900 dark:text-white">Yangi yaratish</span>
        </div>

        <h1 class="text-3xl font-800 tracking-tighter uppercase dark:text-white mb-10">Yangi dars qo'shish</h1>

        <form th:action="@{/lessons/save}" method="post" class="space-y-8">
            <input type="hidden" name="sectionId" th:value="${sectionId}" />

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Dars nomi</label>
                <input type="text" name="title" required
                       placeholder="Masalan: Javaga kirish"
                       class="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Dars tartib raqami</label>
                <input type="text" name="order" required
                       placeholder="Masalan: 1"
                       class="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Dars haqida qisqacha</label>
                <textarea name="description" rows="5" required
                          placeholder="Bo'lim mazmuni haqida ma'lumot kiriting..."
                          class="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"></textarea>
            </div>

            <div class="flex items-center gap-4 pt-4">
                <button type="submit"
                        class="flex-1 bg-brand-500 hover:bg-brand-600 text-white font-800 uppercase tracking-[0.2em] text-[11px] py-5 rounded-2xl transition-all shadow-xl shadow-brand-500/20 active:scale-[0.98]">
                    Dars saqlash
                </button>
                <a href="/lessons/manage"
                   class="px-8 py-5 border border-slate-200 dark:border-white/10 rounded-2xl text-[11px] font-bold uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-white/5 transition-all">
                    Bekor qilish
                </a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: myFooter}"></div>

</body>
</html>
