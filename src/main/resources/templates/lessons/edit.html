<!DOCTYPE html>
<html lang="uz" x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<head th:replace="~{fragments/head :: myHead}">
    <title>Yangi Kurs — DasturHub</title>
</head>
<body class="bg-[#fcfcfc] dark:bg-[#050505] text-slate-900 dark:text-slate-100">

<div th:replace="~{fragments/header :: myHeader('lessons_manage')}"></div>

<main class="pt-24 pb-20">
    <div class="max-w-3xl mx-auto px-6">

        <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-4">
            <a th:href="@{/lessons/manage/{id}(id=${sectionId})}" class="hover:text-brand-500 transition">Bo'limlar</a>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
            <span class="text-slate-900 dark:text-white">Yangi yaratish</span>
        </div>

        <h1 th:text="${lesson?.title + ' ' + 'tahrirlash'}" class="text-3xl font-800 tracking-tighter uppercase dark:text-white mb-10">Darsni tahrirlash</h1>

        <form th:action="@{/lessons/update/{id}(id=${lesson.id})}" method="post" class="space-y-8">

            <input type="hidden" name="sectionId" th:value="${sectionId}" />

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Dars nomi</label>
                <input type="text" name="title" th:value="${lesson.title}" required
                       class="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl px-5 py-4 focus:border-brand-500 outline-none">
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Dars tartib raqami</label>
                <input type="text" name="order" th:value="${lesson.order}" required
                       class="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl px-5 py-4 focus:border-brand-500 outline-none">
            </div>

            <div class="space-y-2">
                <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500">Dars haqida</label>
                <textarea name="description" rows="5" required th:text="${lesson.description}"
                          class="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl px-5 py-4 focus:border-brand-500 outline-none"></textarea>
            </div>

            <div class="flex items-center gap-4">
                <button type="submit" class="flex-1 bg-brand-500 text-white font-800 uppercase py-5 rounded-2xl shadow-xl shadow-brand-500/20">
                    O'zgarishlarni saqlash
                </button>
                <a th:href="@{/lessons/manage/{id}(id=${sectionId})}" class="px-8 py-5 border border-slate-200 dark:border-white/10 rounded-2xl text-[11px] font-bold uppercase">
                    Bekor qilish
                </a>
            </div>
        </form>

    </div>
</main>

<div th:replace="~{fragments/footer :: myFooter}"></div>

</body>
</html>
