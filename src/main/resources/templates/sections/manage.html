<!DOCTYPE html>
<html lang="uz" x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<head th:replace="~{fragments/head :: myHead}">
    <title>Bo'limlarni boshqarish — DasturHub</title>
</head>
<body class="bg-[#fcfcfc] dark:bg-[#050505] text-slate-900 dark:text-slate-100 transition-colors duration-500">

<div th:replace="~{fragments/header :: myHeader('sections_manage')}"></div>

<main class="pt-24 pb-20">
    <div class="max-w-7xl mx-auto px-6">

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <div>
                <a th:href="@{/courses/manage}" class="inline-flex items-center gap-1 text-slate-500 hover:text-brand-500 mb-2 transition-colors text-xs font-bold uppercase tracking-wider group">
                    <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Ortga qaytish
                </a>

                <h1 class="text-3xl font-800 tracking-tighter uppercase dark:text-white">Bo'limlarni boshqarish</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Loyiha tarkibidagi barcha bo'limlar ro'yxati</p>
            </div>

            <a th:href="@{/sections/create/{id}(id=${courseId})}"
               class="inline-flex items-center justify-center gap-2 bg-brand-500 hover:bg-brand-600 text-white px-6 py-3 rounded-xl text-xs font-800 uppercase tracking-widest transition-all shadow-lg shadow-brand-500/20 active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                </svg>
                Yangi bo'lim qo'shish
            </a>
        </div>

        <div class="bg-white dark:bg-white/5 border border-slate-100 dark:border-white/5 rounded-3xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/[0.02]">
                        <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">Bo'lim nomi</th>
                        <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">Tavsifi </th>
                        <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">Tartib raqami</th>
                        <th class="px-6 py-5 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 text-right">Amallar</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-white/5">
                    <tr th:each="section : ${sections}" class="group hover:bg-slate-50/50 dark:hover:bg-white/[0.01] transition-colors">
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-4">
                                <div>
                                    <div th:text="${section.title}" class="font-bold dark:text-white group-hover:text-brand-500 transition-colors">Java Spring Boot</div>
                                </div>
                            </div>
                        </td>
                         <td class="px-6 py-5">
                            <span th:text="${section.description}" class="px-3 py-1 bg-slate-100 dark:bg-white/10 rounded-full text-[10px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-widest">Backend</span>
                         </td>
                         <td class="px-6 py-5">
                             <span class="font-bold text-brand-500" th:text="${section.order}">0</span>
                         </td>
                        <td class="px-6 py-5">
                            <div class="flex items-center justify-end gap-2">
                                <a th:href="@{/sections/edit/{id}(id=${section.id})}"
                                   class="p-2 hover:bg-blue-500/10 text-slate-400 hover:text-blue-500 rounded-lg transition-colors" title="Tahrirlash">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </a>
                                <a th:href="@{/sections/manage/{id}}"
                                   class="p-2 hover:bg-brand-500/10 text-slate-400 hover:text-brand-500 rounded-lg transition-colors" title="Tarkibni boshqarish">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                                </a>
                                <button type="button"
                                        th:data-id="${section.id}"
                                        onclick="deleteSection(this.getAttribute('data-id'))"
                                        class="p-2 hover:bg-red-500/10 text-slate-400 hover:text-red-500 rounded-lg transition-colors"
                                        title="O'chirish">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(sections)}" class="py-20 text-center">
                <div class="w-16 h-16 bg-slate-100 dark:bg-white/5 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                </div>
                <p class="text-slate-400 text-sm font-medium uppercase tracking-widest">Bo'limlar topilmadi</p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: myFooter}"></div>

</body>
</html>
